<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open It</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bc-bg: #17111f;
  --bc-panel: #201931;
  --bc-panel-2: #2a2140;
  --bc-border: rgba(216, 180, 106, 0.18);
  --bc-border-strong: rgba(216, 180, 106, 0.4);
  --bc-gold: #d8b46a;
  --bc-gold-soft: #ecd8a6;
  --bc-emerald: #52b993;
  --bc-text: #f3eee2;
  --bc-text-dim: #b6accd;
  --bc-text-mute: #837a9c;
  --bc-danger: #e2685e;
}
*, *::before, *::after { box-sizing: border-box; }

#bc-root {
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--bc-text);
  background: var(--bc-bg);
  border-radius: 14px;
  padding: 0;
  max-width: 100%;
  overflow: hidden;
  border: 1px solid var(--bc-border);
}
#bc-root * { box-sizing: border-box; }
#bc-root .bc-serif { font-family: 'Cinzel', serif; }

.bc-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--bc-border);
  background: linear-gradient(180deg, #241b38, #1b1428);
}
.bc-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 21px;
  letter-spacing: 0.02em;
  margin: 0;
  color: var(--bc-gold-soft);
}
.bc-stats { display: flex; gap: 18px; }
.bc-stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.bc-stat-value { font-family: 'Cinzel', serif; font-weight: 700; font-size: 18px; color: var(--bc-gold-soft); }
.bc-stat-income .bc-stat-value { color: var(--bc-emerald); }
.bc-stat-label { font-size: 11px; color: var(--bc-text-mute); }

.bc-niveau-bar { padding: 10px 20px; background: var(--bc-panel-2); border-bottom: 1px solid var(--bc-border); cursor: pointer; transition: background 0.15s ease; }
.bc-niveau-bar:hover { background: #352a4f; }
.bc-niveau-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.bc-niveau-txt { display: inline-flex; align-items: center; gap: 8px; font-family: 'Cinzel', serif; font-weight: 700; font-size: 13.5px; color: var(--bc-gold-soft); }
.bc-niveau-embleme-mini { display: inline-flex; line-height: 0; }
.bc-niveau-embleme-mini svg { display: block; }
.bc-niveau-rang { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; color: var(--bc-text-dim); }
.bc-niveau-xp { font-size: 11px; color: var(--bc-text-mute); font-variant-numeric: tabular-nums; }

.bc-rankup-overlay {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
  background: rgba(10,7,15,0); pointer-events: none; transition: background 0.4s ease;
}
.bc-rankup-overlay.bc-visible { background: rgba(8,6,13,0.86); pointer-events: auto; cursor: pointer; }
.bc-rankup-card {
  text-align: center; opacity: 0; transform: scale(0.7) translateY(16px);
  transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.2, 0.9, 0.25, 1.3);
}
.bc-rankup-overlay.bc-visible .bc-rankup-card { opacity: 1; transform: scale(1) translateY(0); }
.bc-rankup-label {
  font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.3em; font-size: 12px;
  color: var(--bc-text-mute); margin: 0 0 18px; text-transform: uppercase;
}
.bc-rankup-embleme {
  margin: 0 auto 20px; width: fit-content;
  filter: drop-shadow(0 0 26px var(--rankup-glow, rgba(216,180,106,0.6)));
  animation: bc-rankup-pulse 1.7s ease-in-out infinite;
}
@keyframes bc-rankup-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.bc-rankup-niveau { font-family: 'Cinzel', serif; font-weight: 700; font-size: 30px; color: var(--bc-gold-soft); margin: 0; }
.bc-rankup-titre {
  font-family: 'Cinzel', serif; font-weight: 600; font-size: 19px; letter-spacing: 0.1em;
  color: var(--bc-text); margin: 6px 0 0; text-transform: uppercase;
}
.bc-rankup-fermer { font-size: 11px; color: var(--bc-text-mute); margin: 22px 0 0; opacity: 0.7; }

.bc-tuto-overlay {
  position: fixed; inset: 0; z-index: 110; display: none; align-items: center; justify-content: center;
  background: rgba(8,6,13,0.9); padding: 20px;
}
.bc-tuto-overlay.bc-visible { display: flex; }
.bc-tuto-card {
  position: relative; width: 100%; max-width: 460px; background: linear-gradient(180deg, #2c2246, #1c1530);
  border: 1px solid rgba(216,180,106,0.35); border-radius: 16px; padding: 32px 28px 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
}
.bc-tuto-passer {
  position: absolute; top: 14px; right: 16px; background: none; border: none;
  color: var(--bc-text-mute); font-size: 12px; cursor: pointer; padding: 4px;
}
.bc-tuto-passer:hover { color: var(--bc-text); }
.bc-tuto-titre { font-family: 'Cinzel', serif; font-weight: 700; font-size: 21px; color: var(--bc-gold-soft); margin: 0 0 14px; }
.bc-tuto-texte { font-size: 14px; color: var(--bc-text-dim); line-height: 1.65; margin: 0; min-height: 110px; }
.bc-tuto-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; gap: 12px; }
.bc-tuto-dots { display: flex; gap: 6px; }
.bc-tuto-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bc-border-strong); }
.bc-tuto-dot.actif { background: var(--bc-gold); }
.bc-tuto-boutons { display: flex; gap: 8px; }
.bc-tuto-boutons .bc-btn { width: auto; padding: 8px 16px; font-size: 12.5px; }

.bc-tabs {
  display: flex;
  gap: 4px;
  padding: 10px 14px 0;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--bc-border);
  background: var(--bc-panel);
}
.bc-tabs::-webkit-scrollbar { display: none; }
.bc-tab {
  flex: 0 0 auto;
  background: transparent;
  border: none;
  color: var(--bc-text-dim);
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  font-weight: 600;
  padding: 9px 14px 11px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.bc-tab:hover { color: var(--bc-text); }
.bc-tab.actif { color: var(--bc-gold-soft); border-bottom-color: var(--bc-gold); }

.bc-content { padding: 18px 20px 24px; min-height: 260px; background: var(--bc-panel); }

.bc-empty { color: var(--bc-text-mute); font-size: 14px; padding: 30px 10px; text-align: center; }

.bc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.bc-grid-succes { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }

.bc-card {
  background: var(--bc-panel-2);
  border: 1px solid var(--bc-border);
  border-radius: 10px;
  padding: 13px 14px;
  border-top: 3px solid var(--bc-mat, var(--bc-gold));
}
.bc-card-nom { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; margin: 0 0 2px; line-height: 1.25; }
.bc-card-sub { font-size: 12px; color: var(--bc-text-mute); margin: 0 0 10px; }

.bc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bc-price { font-size: 13px; color: var(--bc-gold-soft); font-weight: 600; }
.bc-price-old { text-decoration: line-through; color: var(--bc-text-mute); font-weight: 400; margin-right: 4px; }
.bc-owned { font-size: 12px; color: var(--bc-text-mute); }

.bc-stepper { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
.bc-step-btn {
  width: 26px; height: 26px; border-radius: 6px;
  background: var(--bc-panel); border: 1px solid var(--bc-border-strong);
  color: var(--bc-text); font-size: 15px; cursor: pointer; line-height: 1;
}
.bc-step-btn:active { transform: scale(0.94); }
.bc-step-val { width: 34px; text-align: center; font-weight: 600; font-size: 13.5px; }
.bc-step-max { font-size: 11px; color: var(--bc-text-mute); text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0 0 0 4px; }
.bc-step-input { height: 26px; padding: 0 3px; border: 1px solid var(--bc-border-strong); border-radius: 6px; background: var(--bc-panel); color: var(--bc-text); font-family: 'Inter', sans-serif; }
.bc-step-input:focus { outline: none; border-color: var(--bc-gold); }
.bc-step-input::-webkit-inner-spin-button, .bc-step-input::-webkit-outer-spin-button { appearance: none; margin: 0; }
.bc-step-input { -moz-appearance: textfield; appearance: textfield; }

.bc-btn {
  width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--bc-border-strong);
  background: var(--bc-panel); color: var(--bc-gold-soft); font-weight: 600; font-size: 13px;
  cursor: pointer; font-family: 'Inter', sans-serif;
}
.bc-btn:hover { background: #352a4f; }
.bc-btn:active { transform: scale(0.98); }
.bc-btn-plein { background: var(--bc-gold); color: #241a0a; border-color: var(--bc-gold); }
.bc-btn-plein:hover { background: var(--bc-gold-soft); }
.bc-btn-fantome { background: transparent; }
.bc-btn:disabled { cursor: not-allowed; opacity: 0.45; }
.bc-btn-petit { width: auto; padding: 6px 12px; font-size: 12px; }

.bc-msg { font-size: 12px; margin-top: 8px; min-height: 15px; }
.bc-msg-err { color: var(--bc-danger); }
.bc-msg-ok { color: var(--bc-emerald); }

.bc-detail { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--bc-border); }
.bc-detail-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
.bc-detail-head h3 { font-family: 'Cinzel', serif; font-size: 16px; margin: 0; }
.bc-lien { background: none; border: none; color: var(--bc-text-mute); font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }

.bc-probas { margin: 10px 0; font-size: 12.5px; }
.bc-proba-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.bc-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.bc-proba-nom { flex: 1; color: var(--bc-text-dim); }
.bc-proba-pct { font-variant-numeric: tabular-nums; color: var(--bc-text); font-weight: 600; }

.bc-reel-wrap {
  position: relative; height: 76px; overflow: hidden; border-radius: 10px;
  background: #100c19; border: 1px solid var(--bc-border-strong); margin: 14px 0 6px;
}
.bc-reel-track { position: absolute; top: 0; left: 0; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 8px; will-change: transform; }
.bc-reel-item {
  flex: 0 0 130px; height: 56px; border-radius: 8px; background: var(--bc-panel-2);
  border: 1px solid var(--bc-border); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 4px 6px; text-align: center;
}
.bc-reel-item .bc-dot { width: 8px; height: 8px; }
.bc-reel-item-nom { font-size: 11px; font-weight: 600; line-height: 1.15; }
.bc-reel-item.bc-gagnant { border-color: var(--bc-gold); box-shadow: 0 0 0 2px var(--bc-gold) inset; }
.bc-reel-pointeur {
  position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--bc-gold);
  transform: translateX(-1px); pointer-events: none;
}
.bc-reel-pointeur::before, .bc-reel-pointeur::after {
  content: ''; position: absolute; left: 50%; transform: translateX(-50%);
  border: 6px solid transparent;
}
.bc-reel-pointeur::before { top: -1px; border-top-color: var(--bc-gold); }
.bc-reel-pointeur::after { bottom: -1px; border-bottom-color: var(--bc-gold); }

.bc-resultat { text-align: center; font-size: 14px; padding: 8px 0 2px; min-height: 22px; }
.bc-jackpot { font-family: 'Cinzel', serif; font-weight: 700; color: var(--bc-gold); animation: bc-pulse 0.6s ease-in-out 2; }
@keyframes bc-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

.bc-log { margin-top: 8px; font-size: 12.5px; color: var(--bc-text-dim); max-height: 130px; overflow-y: auto; }
.bc-log-row { display: flex; gap: 8px; padding: 2px 0; align-items: center; }

.bc-categorie { margin-bottom: 22px; }
.bc-categorie-titre {
  font-family: 'Cinzel', serif; font-weight: 700; font-size: 14px; letter-spacing: 0.04em;
  color: var(--bc-emerald); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--bc-border);
  text-transform: uppercase;
}
.bc-collec-groupe { margin-bottom: 20px; }
.bc-collec-groupe h3 { font-family: 'Cinzel', serif; font-size: 15px; margin: 0 0 10px; color: var(--bc-gold-soft); }
.bc-item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.bc-item-chip {
  border-radius: 8px; padding: 9px 10px; font-size: 12px; border: 1px solid var(--bc-border);
  background: var(--bc-panel-2);
}
.bc-item-chip.bc-manquant { border-style: dashed; opacity: 0.55; }
.bc-item-chip-nom { font-weight: 600; margin: 3px 0 1px; }
.bc-item-chip-qte { color: var(--bc-text-mute); font-size: 11px; }

.bc-progress-bar { height: 6px; border-radius: 3px; background: var(--bc-panel-2); overflow: hidden; margin: 6px 0 18px; border: 1px solid var(--bc-border); }
.bc-progress-fill { height: 100%; background: var(--bc-emerald); }

.bc-upgrade-card { padding: 15px 16px; }

.bc-succes-verrouille { opacity: 0.5; }
.bc-succes-ok { border-color: var(--bc-gold); box-shadow: 0 0 0 1px rgba(216,180,106,0.3) inset; }
.bc-succes-head { display: flex; align-items: center; gap: 10px; }
.bc-succes-badge {
  width: 46px; height: 46px; border-radius: 50%; border: 2px solid;
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.bc-succes-etat { font-size: 11px; color: var(--bc-text-mute); }
.bc-upgrade-top { display: flex; align-items: baseline; justify-content: space-between; }
.bc-upgrade-niveau { font-size: 12px; color: var(--bc-text-mute); }
.bc-upgrade-desc { font-size: 12.5px; color: var(--bc-text-dim); margin: 4px 0 12px; }
.bc-slider-row { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; }
.bc-slider-row input[type=range] { flex: 1; accent-color: var(--bc-gold); }
.bc-slider-val { font-weight: 700; font-size: 13px; min-width: 46px; text-align: right; }
.bc-slider-note { font-size: 11.5px; color: var(--bc-text-mute); margin-top: 4px; }

.bc-dlc-actifs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.bc-dlc-badge { font-size: 12px; padding: 6px 10px; border-radius: 20px; background: rgba(82,185,147,0.15); color: var(--bc-emerald); border: 1px solid rgba(82,185,147,0.35); }
.bc-code-row { display: flex; gap: 8px; max-width: 360px; }
.bc-code-row input {
  flex: 1; background: var(--bc-panel-2); border: 1px solid var(--bc-border-strong); border-radius: 8px;
  color: var(--bc-text); padding: 9px 10px; font-size: 13px; font-family: 'Inter', monospace;
}
.bc-code-row input:focus { outline: none; border-color: var(--bc-gold); }

.bc-bonus-btn {
  border: 1px solid var(--bc-gold);
  background: rgba(216, 180, 106, 0.14);
  color: var(--bc-gold-soft);
  font-weight: 700;
  font-size: 12.5px;
  padding: 7px 13px;
  border-radius: 20px;
  cursor: pointer;
  animation: bc-bonus-pulse 1.3s ease-in-out infinite;
}
.bc-reset-btn { width: auto; padding: 6px 10px; font-size: 11px; color: var(--bc-danger); border-color: rgba(226,104,94,0.45); }
.bc-aide-btn { width: 30px; padding: 6px 0; font-size: 13px; font-weight: 700; }
@keyframes bc-bonus-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(216, 180, 106, 0.45); }
  50% { box-shadow: 0 0 0 6px rgba(216, 180, 106, 0); }
}

.bc-toast {
  position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 12px);
  background: #2a2140; border: 1px solid var(--bc-border-strong); color: var(--bc-text);
  padding: 9px 16px; border-radius: 8px; font-size: 12.5px; opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease; max-width: 88%; text-align: center;
}
.bc-toast.bc-visible { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 480px) {
  .bc-header { padding: 14px 14px 10px; }
  .bc-content { padding: 14px 14px 20px; }
  .bc-stats { gap: 12px; }
}
</style>
<style>
  html { min-height: 100%; background: #0d0a13; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 40px 16px;
    background: radial-gradient(circle at 50% 0%, #241b38 0%, #0d0a13 62%);
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  .bc-bg-anim { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .bc-ember {
    position: absolute; bottom: -10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(216,180,106,0.95), rgba(216,180,106,0) 70%);
    animation-name: bc-flotter; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes bc-flotter {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    8% { opacity: 1; }
    92% { opacity: 0.5; }
    100% { transform: translateY(-110vh) translateX(var(--derive, 20px)); opacity: 0; }
  }

  .bc-layout { position: relative; z-index: 1; display: flex; align-items: flex-start; gap: 22px; max-width: 1320px; width: 100%; flex-wrap: wrap; justify-content: center; }
  #bc-root { max-width: 960px; width: 100%; flex: 1 1 640px; box-shadow: 0 30px 80px rgba(0,0,0,0.45); }

  .bc-side { width: 360px; flex: 0 0 360px; display: flex; flex-direction: column; gap: 18px; }
  .bc-side-box {
    background: linear-gradient(180deg, #2c2246, #211a35);
    border: 1px solid rgba(216, 180, 106, 0.3);
    border-top: 3px solid var(--bc-accent, var(--bc-gold));
    border-radius: 14px;
    padding: 18px 20px 20px;
    box-shadow: 0 22px 55px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03) inset;
  }
  .bc-side-box-cheats { --bc-accent: var(--bc-danger); }
  .bc-side-box-caches { --bc-accent: #b98bfc; }
  .bc-side-box-save { --bc-accent: var(--bc-emerald); }
  .bc-save-actions { display: flex; flex-direction: column; gap: 10px; }

  .bc-side-titre {
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 16.5px; letter-spacing: 0.02em;
    color: var(--bc-gold-soft); margin: 0 0 12px; padding-bottom: 10px; border-bottom: 1px solid var(--bc-border);
  }
  .bc-side-intro { font-size: 13px; color: var(--bc-text-mute); margin: 0 0 14px; line-height: 1.5; }

  .bc-side-box .bc-code-row { flex-direction: column; max-width: none; gap: 10px; }
  .bc-side-box .bc-code-row input {
    width: 100%; padding: 12px 13px; font-size: 14px; letter-spacing: 0.03em;
    background: #140f20 !important; border: 1px solid rgba(216, 180, 106, 0.45) !important;
    color: #f3eee2 !important; border-radius: 8px;
  }
  .bc-side-box .bc-code-row input::placeholder { color: var(--bc-text-mute); }
  .bc-side-box .bc-code-row input:focus { border-color: var(--bc-gold) !important; }
  .bc-side-box .bc-code-row button {
    width: 100%; padding: 11px 12px; font-size: 13.5px;
    background: var(--bc-gold) !important; color: #241a0a !important; border: 1px solid var(--bc-gold) !important;
    font-weight: 700; border-radius: 8px;
  }
  .bc-side-box .bc-code-row button:hover { background: var(--bc-gold-soft) !important; }

  .bc-journal { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 4px; }
  .bc-journal-entree { border-left: 2px solid var(--bc-border-strong); padding-left: 13px; }
  .bc-journal-date { font-size: 11.5px; color: var(--bc-text-mute); margin: 0 0 3px; text-transform: uppercase; letter-spacing: 0.05em; }
  .bc-journal-titre { font-size: 15px; font-weight: 700; color: var(--bc-text); margin: 0 0 4px; }
  .bc-journal-texte { font-size: 13px; color: var(--bc-text-dim); margin: 0; line-height: 1.55; }

  .bc-succes-caches { display: flex; flex-direction: column; gap: 16px; }
  .bc-succes-cache-carte { border-left: 2px solid var(--bc-gold); padding-left: 13px; }
  .bc-succes-cache-titre { font-size: 15px; font-weight: 700; color: var(--bc-gold-soft); margin: 0 0 4px; }
  .bc-succes-cache-commentaire { font-size: 13px; color: var(--bc-text-dim); margin: 0; font-style: italic; line-height: 1.5; }
  .bc-succes-cache-vide { font-size: 13px; color: var(--bc-text-mute); font-style: italic; line-height: 1.6; }

  @media (max-width: 900px) {
    .bc-layout { flex-direction: column; align-items: stretch; }
    #bc-root { flex: none; }
    .bc-side { width: 100%; flex: none; }
  }
</style>
</head>
<body>
<div class="bc-bg-anim" id="bc-bg-anim" aria-hidden="true"></div>
<script>
(function () {
  var zone = document.getElementById("bc-bg-anim");
  var n = 26;
  for (var i = 0; i < n; i++) {
    var e = document.createElement("div");
    e.className = "bc-ember";
    var taille = 2 + Math.random() * 4;
    e.style.width = taille + "px";
    e.style.height = taille + "px";
    e.style.left = Math.random() * 100 + "vw";
    e.style.setProperty("--derive", (Math.random() * 60 - 30) + "px");
    var duree = 10 + Math.random() * 14;
    e.style.animationDuration = duree + "s";
    e.style.animationDelay = (-Math.random() * duree) + "s";
    zone.appendChild(e);
  }
})();
</script>

<div class="bc-layout" id="bc-layout">
<div id="bc-root">
  <header class="bc-header">
    <h1 class="bc-title">Open It</h1>
    <div id="bonus-zone"></div>
    <div class="bc-stats">
      <div class="bc-stat">
        <span class="bc-stat-value" id="stat-or">0</span>
        <span class="bc-stat-label">or</span>
      </div>
      <div class="bc-stat bc-stat-income">
        <span class="bc-stat-value" id="stat-income">+0</span>
        <span class="bc-stat-label">/ seconde</span>
      </div>
      <div class="bc-stat">
        <span class="bc-stat-value" id="stat-boxes">0</span>
        <span class="bc-stat-label">boîtes</span>
      </div>
      <button class="bc-btn bc-btn-fantome bc-reset-btn" data-action="reset">Reset</button>
      <button class="bc-btn bc-btn-fantome bc-aide-btn" data-action="ouvrir-tuto" title="Revoir le tutoriel">?</button>
    </div>
  </header>

  <div class="bc-niveau-bar" id="bc-niveau-bar" data-action="voir-rang" title="Voir mon rang"></div>

  <nav class="bc-tabs" id="bc-tabs"></nav>

  <main class="bc-content" id="bc-content"></main>

  <div class="bc-toast" id="bc-toast"></div>
</div>

<div class="bc-rankup-overlay" id="bc-rankup-overlay" data-action="fermer-rankup">
  <div class="bc-rankup-card">
    <p class="bc-rankup-label" id="bc-rankup-label">Rang supérieur</p>
    <div class="bc-rankup-embleme" id="bc-rankup-embleme"></div>
    <p class="bc-rankup-niveau" id="bc-rankup-niveau"></p>
    <p class="bc-rankup-titre" id="bc-rankup-titre"></p>
    <p class="bc-rankup-fermer">cliquer pour fermer</p>
  </div>
</div>

<div class="bc-tuto-overlay" id="bc-tuto-overlay">
  <div class="bc-tuto-card">
    <button class="bc-tuto-passer" data-action="tuto-fermer">Passer ✕</button>
    <div id="bc-tuto-corps"></div>
    <div class="bc-tuto-nav">
      <div class="bc-tuto-dots" id="bc-tuto-dots"></div>
      <div class="bc-tuto-boutons">
        <button class="bc-btn bc-btn-fantome" data-action="tuto-precedent" id="bc-tuto-btn-prec">Précédent</button>
        <button class="bc-btn bc-btn-plein" data-action="tuto-suivant" id="bc-tuto-btn-suiv">Suivant</button>
      </div>
    </div>
  </div>
</div>

<aside class="bc-side">
  <div class="bc-side-box">
    <h2 class="bc-side-titre">Mises à jour</h2>
    <div id="bc-journal" class="bc-journal"></div>
  </div>

  <div class="bc-side-box bc-side-box-cheats">
    <h2 class="bc-side-titre">Les cheats du dev</h2>
    <p class="bc-side-intro">Codes secrets. À utiliser à tes risques et périls.</p>
    <div class="bc-code-row">
      <input type="text" id="champ-cheat" placeholder="CODE SECRET">
      <button class="bc-btn bc-btn-plein bc-btn-petit" data-action="activer-cheat">Activer</button>
    </div>
    <div class="bc-msg" id="msg-cheat"></div>
  </div>

  <div class="bc-side-box bc-side-box-caches">
    <h2 class="bc-side-titre">Les succès du dev</h2>
    <div id="bc-succes-caches" class="bc-succes-caches"></div>
  </div>

  <div class="bc-side-box bc-side-box-save">
    <h2 class="bc-side-titre">Sauvegarde</h2>
    <p class="bc-side-intro">Exporte ta progression dans un fichier, ou récupère une sauvegarde existante.</p>
    <div class="bc-save-actions">
      <button class="bc-btn bc-btn-plein" data-action="exporter-save">Exporter (.json)</button>
      <button class="bc-btn bc-btn-fantome" data-action="importer-save">Importer un fichier</button>
      <input type="file" id="fichier-import" accept="application/json,.json" style="display:none;">
    </div>
    <div class="bc-msg" id="msg-save"></div>
  </div>
</aside>
</div>

<script src="contenu.js"></script>
<script src="journal.js"></script>
<script src="succes_caches.js"></script>
<script src="systeme.js"></script>
</body>
</html>
